<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.R.I.A</title>
<style>
  :root { --bg: #0b1020; --panel: #141a2e; --accent: #22d3ee; --text: #e2e8f0; --muted: #94a3b8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid #1f2942; display: flex; align-items: center; gap: 10px; }
  header .logo { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 2px; }
  header .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #1d4ed8; }
  .sia { align-self: flex-start; background: var(--panel); border: 1px solid #1f2942; }
  .confirm { align-self: center; background: #3b1d0e; border: 1px solid #b45309; border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
  .confirm button { background: var(--accent); color: #0b1020; border: 0; border-radius: 8px; padding: 6px 14px; font-weight: 600; cursor: pointer; }
  .confirm button.no { background: #475569; color: var(--text); }
  footer { padding: 12px 20px; background: var(--panel); border-top: 1px solid #1f2942; display: flex; gap: 10px; }
  input { flex: 1; background: #0b1020; border: 1px solid #1f2942; border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; }
  input:focus { border-color: var(--accent); }
  .err { color: #f87171; }
</style>
</head>
<body>
<header>
  <span class="logo"></span>
  <h1>A.R.I.A</h1>
  <span class="status" id="status">conectando…</span>
</header>
<main id="chat"></main>
<footer>
  <input id="input" placeholder="Habla con A.R.I.A…" autocomplete="off">
</footer>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const status = document.getElementById("status");

function addMsg(kind, text) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

const ws = new WebSocket(`ws://${location.host}/ws/chat`);
ws.onopen = () => { status.textContent = "conectado"; };
ws.onclose = () => { status.textContent = "desconectado"; };
ws.onerror = () => { status.textContent = "error"; };

ws.onmessage = (event) => {
  const data = JSON.parse(event.data);
  if (data.type === "response") addMsg("sia", data.content);
  if (data.type === "error") addMsg("sia err", data.message);
  if (data.type === "confirm") {
    const args = Object.entries(data.arguments).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
    const div = document.createElement("div");
    div.className = "confirm";
    const span = document.createElement("span");
    span.textContent = `¿Permitir ${data.tool}(${args})?`;
    const yes = document.createElement("button");
    yes.textContent = "Permitir";
    yes.onclick = () => ws.send(JSON.stringify({ type: "confirm_response", request_id: data.request_id, approved: true }));
    const no = document.createElement("button");
    no.className = "no";
    no.textContent = "Denegar";
    no.onclick = () => ws.send(JSON.stringify({ type: "confirm_response", request_id: data.request_id, approved: false }));
    div.append(span, yes, no);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
};

function send() {
  const text = input.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  addMsg("user", text);
  ws.send(JSON.stringify({ type: "message", text }));
  input.value = "";
}

input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
